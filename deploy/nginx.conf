# nginx site for the portal on an AWS EC2 instance (also fine on a server shared with
# other university sites). Install:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/idealab.conf
#   (edit server_name) ; sudo ln -s /etc/nginx/sites-available/idealab.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d idealab.reva.edu.in      # free HTTPS certificate
#
# The app listens on 127.0.0.1:3001 (docker compose publishes it on loopback only).

server {
    listen 80;
    listen [::]:80;
    server_name idealab.reva.edu.in;

    # Do not reveal the nginx version in headers and error pages.
    server_tokens off;

    # 3D models and videos are up to 50 MB.
    client_max_body_size 60m;
    client_body_timeout 120s;

    access_log /var/log/nginx/idealab.access.log;
    error_log  /var/log/nginx/idealab.error.log;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
# certbot adds the "listen 443 ssl" block and the HTTP->HTTPS redirect.
